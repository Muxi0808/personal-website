<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>页面走丢了 · Muxi0808 的博客</title>
<meta name="description" content="404 — 找不到这个页面。">
<meta name="robots" content="noindex">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<script>
  /* 404 页在 GitHub Pages 上会被任意深度的路径命中，所以外链资源一律走绝对路径。
     若部署在项目页（https://<user>.github.io/<repo>/），把下面这行改成 "/<repo>/"。 */
  window.SITE_BASE = "/";
  try {
    var saved = localStorage.getItem("muxi-theme");
    var dark = saved
      ? saved === "dark"
      : window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
    if (dark) document.documentElement.setAttribute("data-theme", "dark");
  } catch (e) {}
</script>
<style>
  :root {
    --bg: #fff; --text: #1a1d21; --muted: #6b7280; --faint: #9ca3af;
    --accent: #2563eb; --border: #e5e7eb;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
      "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", Roboto, sans-serif;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  html[data-theme="dark"] {
    --bg: #0f1115; --text: #e8eaed; --muted: #9aa4b2; --faint: #6b7684;
    --accent: #6aa5ff; --border: #262c36;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    background: var(--bg); color: var(--text); font-family: var(--sans);
    line-height: 1.75; padding: 2rem 1.25rem; text-align: center;
  }
  .code {
    font-family: var(--mono); font-size: clamp(3rem, 14vw, 5rem);
    font-weight: 700; color: var(--accent); line-height: 1; letter-spacing: -0.03em;
  }
  h1 { font-size: 1.35rem; margin: 1.25rem 0 0.5rem; letter-spacing: -0.01em; }
  p { color: var(--muted); margin: 0 0 1.75rem; max-width: 30rem; }
  a.home {
    display: inline-block; padding: 0.6rem 1.35rem; border-radius: 8px;
    background: var(--accent); color: #fff; text-decoration: none;
    font-size: 0.95rem; font-weight: 500;
  }
  a.home:hover { filter: brightness(1.08); }
  footer { margin-top: 3rem; color: var(--faint); font-size: 0.85rem; }
  footer a { color: var(--muted); }
</style>
</head>
<body>
  <div>
    <div class="code">404</div>
    <h1>这个页面走丢了</h1>
    <p>你访问的地址不存在，或者文章已经被移动、改名。检查一下链接拼写，或者从首页重新找找。</p>
    <a class="home" id="home-link" href="/">← 回到首页</a>
    <footer>© <span id="year"></span> Muxi0808 · <a id="rss-link" href="/feed.xml">RSS</a></footer>
  </div>
  <script>
    (function () {
      var base = window.SITE_BASE || "/";
      document.getElementById("home-link").setAttribute("href", base);
      document.getElementById("rss-link").setAttribute("href", base + "feed.xml");
      document.getElementById("year").textContent = String(new Date().getFullYear());
    })();
  </script>
</body>
</html>
